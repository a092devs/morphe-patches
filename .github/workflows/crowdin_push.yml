name: Crowdin push from GitHub

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - patches/src/main/resources/addresources/values/**/strings.xml

jobs:
  push:
    name: Push strings
    runs-on: ubuntu-latest
    steps:
      - name: Check Crowdin credentials
        id: check_auth
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [ -z "$CROWDIN_PROJECT_ID" ] || [ -z "$CROWDIN_PERSONAL_TOKEN" ]; then
            echo "Crowdin credentials (CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN) are not configured. Skipping Crowdin push."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout dev
        if: steps.check_auth.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          clean: true

      - name: Push strings
        if: steps.check_auth.outputs.configured == 'true'
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          upload_sources: true
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
