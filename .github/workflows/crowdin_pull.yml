name: Crowdin pull and merge
on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:

jobs:
  pull:
    name: Pull translations from Crowdin
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check_auth.outputs.configured }}
    steps:
      - name: Check Crowdin credentials
        id: check_auth
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [ -z "$CROWDIN_PROJECT_ID" ] || [ -z "$CROWDIN_PERSONAL_TOKEN" ]; then
            echo "Crowdin credentials (CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN) are not configured. Skipping Crowdin operations."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout dev
        if: steps.check_auth.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          clean: true

      - name: Reset Crowdin branch
        if: steps.check_auth.outputs.configured == 'true'
        run: git push origin dev:crowdin --force

      - name: Pull strings from Crowdin
        if: steps.check_auth.outputs.configured == 'true'
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          upload_sources: false
          download_translations: true
          skip_ref_checkout: true
          localization_branch_name: crowdin
          create_pull_request: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  merge:
    name: Squash merge Crowdin into Dev
    if: github.event_name == 'workflow_dispatch' && needs.pull.outputs.configured == 'true'
    needs: pull
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout crowdin branch to run checks on it
      - name: Checkout crowdin branch
        uses: actions/checkout@v7
        with:
          ref: crowdin
          fetch-depth: 0
          clean: true

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      # Step 2: Run string checks on the crowdin branch
      - name: Check strings on crowdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew checkStringResources

      # Step 3: Checkout dev branch to prepare for merging
      - name: Checkout dev branch for merge
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          clean: true

      # Step 4: Fetch the latest crowdin branch (already checked)
      - name: Fetch crowdin branch
        run: git fetch origin crowdin

      # Step 5: Squash merge crowdin into dev
      - name: Squash merge crowdin into dev
        run: |
          git config --local user.name "Crowdin Bot"
          git config --local user.email "support+bot@crowdin.com"
          git merge --squash origin/crowdin
          git commit --allow-empty -m "chore: Update translations from Crowdin"
          git push origin dev
